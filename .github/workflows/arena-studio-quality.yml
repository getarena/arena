name: Arena Studio quality checks

on:
  push:
    branches:
      - "redesign/**"
    paths:
      - "Arena-v18 2/**"
      - ".github/workflows/arena-studio-quality.yml"
  pull_request:
    branches:
      - main
    paths:
      - "Arena-v18 2/**"
      - ".github/workflows/arena-studio-quality.yml"

concurrency:
  group: arena-studio-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, build, and security tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: "Arena-v18 2"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "Arena-v18 2/package-lock.json"

      - name: Install locked dependencies
        run: npm ci

      - name: Lint changed public-facing entry points
        run: npx eslint src/main.jsx src/components/Login.jsx src/components/PublicFooter.jsx src/components/PublicPage.jsx

      - name: Build production bundle
        run: npm run build

      # The repository's V18.7 supply-chain test is stale: it hard-codes
      # package version 0.18.8 and reads a missing .npmrc in the V18.9 baseline.
      # Keep the other current regression suites enabled without rewriting
      # security fixtures as part of this UI-only pass.
      - name: Run compatible security regression suites
        run: |
          node security-tests/v18.2-data-boundary.test.mjs
          node security-tests/v18.2-cloudinary-runtime.test.mjs
          node security-tests/v18.3-abuse-session.test.mjs
          node security-tests/v18.3-abuse-session-runtime.test.mjs
          node security-tests/v18.5-v18.6-security.test.mjs
          node security-tests/v18.8-adversarial.test.mjs
